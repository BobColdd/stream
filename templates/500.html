<!DOCTYPE html>
<html>
<head>
    <title>500 - Server Error</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f5f7fa; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; padding: 20px; }
        h1 { font-size: 6rem; color: #ff1744; margin-bottom: 16px; }
        h2 { font-size: 2rem; margin-bottom: 12px; }
        p { color: #666; margin-bottom: 20px; }
        a { display: inline-block; padding: 10px 24px; background: #1a73e8; color: white; text-decoration: none; border-radius: 8px; }
        a:hover { background: #1557b0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Something went wrong on our end. Please try again later.</p>
        <a href="/">Return Home</a>
    </div>
</body>
</html>
