<!DOCTYPE html>
<html>
<head>
    <title>LiveKick - Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        .back-btn { display: inline-block; padding: 8px 16px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; }
        .back-btn:hover { background: #555; }
        h1 { color: #1a73e8; margin-bottom: 20px; }
        .player-container { background: #000; border-radius: 12px; overflow: hidden; position: relative; }
        .video-player { width: 100%; max-height: 500px; background: #000; }
        .stream-selector { margin-top: 20px; background: #2a2a2a; border-radius: 12px; padding: 20px; }
        .stream-selector h3 { margin-bottom: 12px; color: #1a73e8; }
        .stream-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .stream-btn { padding: 10px 20px; background: #333; color: #fff; border: 2px solid #555; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
        .stream-btn:hover { background: #444; border-color: #1a73e8; }
        .stream-btn.active { background: #1a73e8; border-color: #1a73e8; }
        .no-streams { text-align: center; padding: 60px 20px; }
        .no-streams .emoji { font-size: 4rem; margin-bottom: 16px; }
        .no-streams p { color: #999; font-size: 1.2rem; }
        .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); color: white; font-size: 1.2rem; }
        .loading-spinner { display: flex; align-items: center; gap: 12px; }
        .loading-spinner::before { content: ''; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-message { color: #ff1744; background: rgba(255,23,68,0.1); padding: 20px; border-radius: 8px; text-align: center; }
        @media (max-width: 768px) { .stream-buttons { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="javascript:history.back()" class="back-btn">← Back</a>
        <h1>📺 Match Stream</h1>

        {% if streams %}
        <div class="stream-selector">
            <h3>Available Streams ({{ streams|length }})</h3>
            <div class="stream-buttons">
                {% for stream in streams %}
                <button class="stream-btn" data-url="{{ stream }}" onclick="playStream(this)">
                    ▶ Stream {{ loop.index }}
                </button>
                {% endfor %}
            </div>
        </div>

        <div class="player-container">
            <video id="video-player" controls autoplay class="video-player"></video>
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-spinner">Loading stream...</div>
            </div>
        </div>
        {% else %}
        <div class="no-streams">
            <div class="emoji">😕</div>
            <p>No streams available for this match</p>
        </div>
        {% endif %}

        <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
        <script>
            let hls = null;
            const video = document.getElementById('video-player');
            const overlay = document.getElementById('loading-overlay');

            function playStream(button) {
                const url = button.getAttribute('data-url');
                
                document.querySelectorAll('.stream-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                overlay.style.display = 'flex';
                overlay.innerHTML = '<div class="loading-spinner">Loading stream...</div>';
                
                if (hls) {
                    hls.destroy();
                    hls = null;
                }
                
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        overlay.style.display = 'none';
                    });
                } else if (Hls.isSupported()) {
                    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        overlay.style.display = 'none';
                        video.play().catch(() => {});
                    });
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            overlay.innerHTML = '<div class="error-message">⚠️ Failed to load stream. Please try another stream.</div>';
                        }
                    });
                } else {
                    overlay.innerHTML = '<div class="error-message">⚠️ HLS is not supported in this browser</div>';
                }
            }

            {% if streams %}
            document.addEventListener('DOMContentLoaded', () => {
                const firstBtn = document.querySelector('.stream-btn');
                if (firstBtn) playStream(firstBtn);
            });
            {% endif %}
        </script>
    </div>
</body>
</html>
